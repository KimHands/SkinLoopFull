# SkinLoop 리버스 프록시: / → FE(Next.js), /api → BE(FastAPI)
events {}

http {
    upstream skinloop_fe { server fe:3000; }
    upstream skinloop_be { server be:8000; }

    server {
        listen 80;
        server_name _;

        # 사진 업로드 등 여유. 기본 1M보다 크게.
        client_max_body_size 10m;

        # API는 백엔드로. /api 접두사를 그대로 전달한다.
        location /api/ {
            proxy_pass http://skinloop_be;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 그 외 전부 프론트엔드로.
        location / {
            proxy_pass http://skinloop_fe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
