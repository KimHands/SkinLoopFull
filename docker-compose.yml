# SkinLoop 로컬 통합 스택: nginx + FE + BE + PostgreSQL
# 사용: cp .env.example .env  →  docker compose up --build  →  http://localhost
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: skinloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skinloop}
      POSTGRES_DB: skinloop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinloop -d skinloop"]
      interval: 5s
      timeout: 3s
      retries: 10

  be:
    build: ./skinloop-be
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://skinloop:${POSTGRES_PASSWORD:-skinloop}@db:5432/skinloop
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 로컬/데모 편의: 앱 시작 시 테이블 생성. 프로덕션에서는 끈다(사람이 수동 생성).
      AUTO_INIT_DB: "1"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  fe:
    restart: unless-stopped
    build:
      context: ./skinloop-fe
      args:
        # 브라우저가 접근하는 오리진(nginx). 배포 시 공인 IP/도메인으로 교체.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost}
    expose:
      - "3000"
    depends_on:
      - be

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fe
      - be

volumes:
  pgdata:
